<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>เข้าสู่ระบบ | IT SHOP</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="auth-page">

    <div class="auth-box">

        <div class="auth-logo">
            IT<span>SHOP</span>
        </div>

        <h1>เข้าสู่ระบบ</h1>

        <form action="/login" method="POST">

            <label>Email</label>
            <input type="email" name="email" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit">
                เข้าสู่ระบบ
            </button>

        </form>

        <a class="auth-link" href="/">
            ยังไม่มีบัญชี? สมัครสมาชิก
        </a>

    </div>

</div>

</body>
</html>
